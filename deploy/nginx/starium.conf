# 弈星纪元兽装工作室官网 — Nginx 站点配置模板
#
# 要点（14 文档）：
# - 只向公网开放 80/443，80 跳 HTTPS；API 监听内网/回环地址；
# - 同域 /api 转发到 FastAPI，静态内容与访问控制在此层处理；
# - 交易及个人 API 禁止 CDN 缓存；支付通知路由不能被交互验证码拦截；
# - 反向代理必须显式传递真实客户端地址，并在应用侧配置 TRUSTED_PROXY_IPS，
#   否则伪造 X-Forwarded-For 可以绕过短信限流。
#
# 使用前替换 starium.cn、证书路径与上游端口。

upstream starium_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# 支付渠道回调与探针不经过交互式验证，单独限制体积与超时。
map $request_uri $starium_no_cache {
    default 0;
    ~^/api/v1/orders 1;
    ~^/api/v1/payment 1;
    ~^/api/v1/me 1;
    ~^/api/v1/admin 1;
    ~^/api/v1/points 1;
    ~^/api/v1/feedback 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name starium.cn www.starium.cn;
    # 备案与证书签发前保留跳转；确认全站 HTTPS 后再启用 HSTS。
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://starium.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name starium.cn;

    ssl_certificate     /etc/letsencrypt/live/starium.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starium.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # 请求体积与超时上限（10 文档：严格限制请求体积、超时和上传范围）
    client_max_body_size 12m;
    client_body_timeout 30s;
    send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    # HSTS 需确认全站（含所有子域）支持 HTTPS 后再启用 includeSubDomains。
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 前端静态包：带内容哈希的资源长缓存，入口短缓存 ----
    root /var/www/starium/current;
    index index.html;

    location ~* ^/(assets|media)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /admin.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://starium_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;

        # 支付通知路由不能被交互验证码/WAF 挑战拦截
        location ~ ^/api/v1/payment-notifications/ {
            proxy_pass http://starium_api;
            proxy_read_timeout 20s;
            access_log /var/log/nginx/starium-payment.log;
        }
    }

    location /api/docs { return 404; }

    location = /healthz {
        proxy_pass http://starium_api;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://starium_api;
        access_log off;
    }

    # ---- SPA 回退：账户页与品牌页共用同一构建包 ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 私密路径不索引
    location ~* ^/(account|admin|pay|checkout|cart|login|payment|feedback) {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
