# Alembic configuration (see docs 05 / 14).
#
# NOTE: this file must stay ASCII-only. Alembic reads alembic.ini with the
# platform locale encoding (GBK on zh-CN Windows), so non-ASCII comments here
# break `alembic upgrade` with a UnicodeDecodeError. Chinese explanations live
# in migrations/env.py and migrations/README.md instead.
#
# The database URL is deliberately NOT stored here: migrations/env.py reads it
# from the application settings (DATABASE_URL / DATA_DIR), so no credential or
# machine path is committed.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Placeholder only, used by offline mode (`alembic upgrade --sql`); env.py
# overrides it with the real URL from application settings.
sqlalchemy.url = driver://user:pass@localhost/dbname
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
