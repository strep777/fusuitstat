[project]
name = "starium-server"
version = "1.0.0"
description = "弈星纪元兽装工作室 — FastAPI 模块化单体后端"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "pyotp>=2.9.0",
    "pillow>=11.0.0",
    "email-validator>=2.2.0",
    # Windows 没有系统 IANA 时区库，缺它会直接让 ZoneInfo("Asia/Shanghai") 抛错，
    # 进而导致整个后端无法导入。Linux/macOS 自带，无需安装。
    "tzdata>=2024.1; sys_platform == 'win32'",
    "boto3>=1.43.97",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "anyio>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    # FastAPI 的依赖注入惯例就是在签名默认值里构造依赖对象
    # （`param: Annotated[Query, Depends()] = Query()`），B008 在这里是误报。
    "B008",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []
exclude = ["migrations/"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
